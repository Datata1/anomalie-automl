[project]
name = "automl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepod>=0.2.0",
    "flaml[automl]>=2.6.0",
    "ipykernel>=7.2.0",
    "marimo>=0.23.9",
    "matplotlib>=3.10.9",
    "minisom>=2.3.6",
    "numpy>=2.4.6",
    "optuna>=4.9.0",
    "pandas>=3.0.3",
    "plotly-express>=0.4.1",
    "pyarrow>=24.0.0",
    "pyod>=3.6.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "torch>=2.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["automl_ad"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "python-pptx>=1.0.2",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: benötigt lokale TEP-Parquet-Dateien unter data/ (sonst übersprungen)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# marimo-Notebooks sind reaktive .py-Dateien mit eigener Struktur → nicht linten.
exclude = ["notebooks", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # Zeilenlänge stilistisch, nicht blockierend

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # bewusste Re-Exports
